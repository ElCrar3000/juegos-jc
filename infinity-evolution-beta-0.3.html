<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Infinity Evolution — Beta 0.3 | Juegos JC</title><style>*{box-sizing:border-box}body{margin:0;background:#090e1a;color:#e9f6ff;font:15px system-ui}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 15px;background:#101b2c}button{background:#17334a;border:1px solid #35728c;border-radius:9px;color:white;padding:9px 12px;cursor:pointer;font-weight:700}button:hover,.active{background:#176a83}#game{display:block;width:100%;height:calc(100dvh - 110px);touch-action:none}#hud{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}#panel{width:min(620px,100%);max-height:92vh;overflow:auto;background:#101d31;border:1px solid #3389a0;border-radius:16px;padding:20px;box-shadow:0 15px 60px #000}#choices{display:grid;gap:9px;margin:12px 0}.choice{text-align:left;padding:14px}small{color:#a9bfd2}#touch{position:fixed;bottom:18px;left:16px;display:none;gap:7px}#touch button{width:46px;height:46px}#shoot{position:fixed;bottom:24px;right:20px;display:none}footer{padding:5px 12px;color:#9cbed0;font-size:12px}@media(pointer:coarse){#touch,#shoot{display:flex}}@media(max-width:600px){#game{height:calc(100dvh - 155px)}header{padding:7px}button{padding:7px}}</style></head><body><header><b>⚡ INFINITY EVOLUTION <small>BETA 0.3 · Juegos JC</small></b><div id="hud"><span id="stats"></span><button id="up">⭐ Mejoras (E)</button><button id="pause">⏸</button><span>Velocidad:</span><span id="speeds"></span></div></header><canvas id="game"></canvas><div id="touch"><div><button data-dir="up">↑</button><div><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></div></div><button id="shoot">🎯 Disparar</button><footer>WASD/flechas: mover · Ratón: apuntar · Clic/espacio: disparar · E: mejoras · 1–3: elegir · P: pausa · R: reiniciar tras morir</footer><div id="overlay"><div id="panel"><h2 id="panelTitle">Mejoras</h2><p id="panelDesc"></p><div id="choices"></div><div style="display:flex;flex-wrap:wrap;gap:7px"><button id="recommended">✨ Recomendada</button><button id="randomAll">🎲 Aplicar todas al azar</button><button id="next">Siguiente</button><button id="close">✕ Cerrar</button></div></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const upgrades=[['Daño +25%','Tus disparos hacen más daño','damage',1.25],['Cadencia +20%','Disparas más a menudo','rate',1.2],['Velocidad +15%','Te mueves más rápido','speed',1.15],['Vida máxima +20','También recuperas 20 puntos','hp',20],['Curación +2','Recuperas vida por segundo','regen',2],['Perdigón +1','Disparas un proyectil adicional','pellets',1],['Alcance +20%','Tus proyectiles duran más','range',1.2],['Imán +30%','Recoges experiencia desde más lejos','magnet',1.3],['Proyectil +20%','Tus balas viajan más rápido','bullet',1.2]];let player,enemies,bullets,orbs,keys={},touch={},mouse={x:W/2+100,y:H/2,down:false},level,xp,need,pending,kills,elapsed,spawn,fire,gameOver,paused,menu,speed=1,last=performance.now(),choices=[];function reset(){player={x:0,y:0,hp:100,max:100,damage:10,rate:2,speed:210,regen:0,pellets:1,range:1,magnet:1,bullet:1};enemies=[];bullets=[];orbs=[];level=1;xp=0;need=12;pending=0;kills=0;elapsed=0;spawn=0;fire=0;gameOver=false;paused=false;menu=false;hide();update()}function update(){$('stats').textContent=`❤️ ${Math.ceil(player.hp)}/${player.max} · Nv.${level} · XP ${Math.floor(xp)}/${need} · ⭐ ${pending} · ☠ ${kills}`;$('up').textContent=`⭐ Mejoras (${pending})`}$('speeds').innerHTML=[1,2,5,10].map(v=>`<button data-speed="${v}" class="${v===1?'active':''}">×${v}</button>`).join('');$('speeds').onclick=e=>{const b=e.target.closest('[data-speed]');if(!b)return;speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(n=>n.classList.toggle('active',+n.dataset.speed===speed))};function hide(){$('overlay').style.display='none'}function open(){if(gameOver)return;menu=true;paused=true;$('overlay').style.display='flex';drawMenu()}function drawMenu(){$('panelTitle').textContent='⭐ Evoluciones pendientes: '+pending;$('panelDesc').textContent=pending?'Elige una mejora. Doble clic o teclas 1–3 para aplicarla directamente.':'No tienes mejoras pendientes. Sigue ganando experiencia.';choices=Array.from({length:3},()=>upgrades[Math.floor(Math.random()*upgrades.length)]);$('choices').innerHTML='';choices.forEach((u,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${i+1}. ${u[0]}</b><br><small>${u[1]}</small>`;b.onclick=()=>apply(i);$('choices').append(b)})}function apply(i){if(!pending)return;const u=choices[i];if(!u)return;let k=u[2],v=u[3];if(k==='hp'){player.max+=v;player.hp=Math.min(player.max,player.hp+v)}else if(['regen','pellets'].includes(k))player[k]+=v;else player[k]*=v;pending--;update();if(pending)drawMenu();else closeMenu()}function closeMenu(){menu=false;paused=false;hide()}$('up').onclick=()=>menu?closeMenu():open();$('close').onclick=closeMenu;$('next').onclick=()=>{if(pending)drawMenu();else closeMenu()};$('recommended').onclick=()=>{if(pending){let ix=choices.findIndex(u=>u[2]==='damage'||u[2]==='pellets');apply(ix<0?0:ix)}};$('randomAll').onclick=()=>{while(pending){drawMenu();apply(Math.floor(Math.random()*3))}};$('pause').onclick=()=>{if(!menu&&!gameOver)paused=!paused};$('shoot').onpointerdown=e=>{e.preventDefault();mouse.down=true};$('shoot').onpointerup=()=>mouse.down=false;document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();touch[b.dataset.dir]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>touch[b.dataset.dir]=false});addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='e')menu?closeMenu():open();if(k==='p'&&!menu)paused=!paused;if(menu&&['1','2','3'].includes(k))apply(+k-1);if(k==='r'&&gameOver)reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('pointerdown',e=>{mouse.down=true;const r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});addEventListener('pointerup',()=>mouse.down=false);function rand(a,b){return a+Math.random()*(b-a)}function step(dt){elapsed+=dt;let dx=(keys.d||keys.arrowright||touch.right?1:0)-(keys.a||keys.arrowleft||touch.left?1:0),dy=(keys.s||keys.arrowdown||touch.down?1:0)-(keys.w||keys.arrowup||touch.up?1:0),m=Math.hypot(dx,dy)||1;player.x+=dx/m*player.speed*dt;player.y+=dy/m*player.speed*dt;player.hp=Math.min(player.max,player.hp+player.regen*dt);spawn-=dt;if(spawn<=0&&enemies.length<160){spawn=Math.max(.13,1.1-elapsed/320);let a=rand(0,Math.PI*2),r=Math.max(W,H)*.65;enemies.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,hp:12+elapsed*.11,r:rand(11,17),speed:rand(35,65)+elapsed*.05,damage:7})}fire-=dt;if(fire<=0&&(mouse.down||keys[' ']||enemies.length)){let target=null,aim=0;if(mouse.down){aim=Math.atan2(mouse.y-H/2,mouse.x-W/2)}else{let d=Infinity;for(const e of enemies){let q=Math.hypot(e.x-player.x,e.y-player.y);if(q<d){d=q;target=e}}if(target)aim=Math.atan2(target.y-player.y,target.x-player.x)}if(mouse.down||target||keys[' ']){fire=1/player.rate;for(let i=0;i<player.pellets;i++){let a=aim+(i-(player.pellets-1)/2)*.14;bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*540*player.bullet,vy:Math.sin(a)*540*player.bullet,life:1.2*player.range,damage:player.damage})}}}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.hp-=b.damage;b.life=0;break}}}bullets=bullets.filter(b=>b.life>0);for(const e of enemies){if(e.hp<=0){orbs.push({x:e.x,y:e.y,v:3});kills++;continue}let a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y);if(d>e.r+12){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}else player.hp-=e.damage*dt}enemies=enemies.filter(e=>e.hp>0);for(const o of orbs){let d=Math.hypot(o.x-player.x,o.y-player.y);if(d<100*player.magnet&&d>0){o.x+=(player.x-o.x)/d*350*dt;o.y+=(player.y-o.y)/d*350*dt}if(d<20){xp+=o.v;o.v=0}}orbs=orbs.filter(o=>o.v>0);while(xp>=need){xp-=need;level++;need=Math.ceil(need*1.19+3);pending++}if(player.hp<=0){player.hp=0;gameOver=true;paused=true}update()}function render(){ctx.fillStyle='#081522';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-player.x,H/2-player.y);let g=80,left=player.x-W/2,top=player.y-H/2;ctx.strokeStyle='#173145';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.floor(left/g)*g;x<left+W+g;x+=g){ctx.moveTo(x,top);ctx.lineTo(x,top+H)}for(let y=Math.floor(top/g)*g;y<top+H+g;y+=g){ctx.moveTo(left,y);ctx.lineTo(left+W,y)}ctx.stroke();for(const o of orbs){ctx.fillStyle='#56f2e2';ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.fill()}for(const b of bullets){ctx.fillStyle='#f9d96c';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}for(const e of enemies){ctx.fillStyle='#f15c78';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#131622';ctx.fillRect(e.x-13,e.y-e.r-10,26,4);ctx.fillStyle='#80f4a1';ctx.fillRect(e.x-13,e.y-e.r-10,26*Math.max(0,e.hp/(12+elapsed*.11)),4)}ctx.shadowColor='#31d9ff';ctx.shadowBlur=17;ctx.fillStyle='#42bff2';ctx.beginPath();ctx.arc(player.x,player.y,15,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=5;let a=Math.atan2(mouse.y-H/2,mouse.x-W/2);ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(a)*23,player.y+Math.sin(a)*23);ctx.stroke();ctx.restore();ctx.fillStyle='#17283b';ctx.fillRect(16,15,Math.min(240,W-32),13);ctx.fillStyle='#53e6b0';ctx.fillRect(16,15,Math.min(240,W-32)*player.hp/player.max,13);ctx.fillStyle='#d5edff';ctx.font='14px system-ui';ctx.fillText(`Tiempo ${Math.floor(elapsed)}s · Enemigos ${enemies.length}`,16,49);if(paused&&!menu){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.fillText(gameOver?'FIN DE PARTIDA':'PAUSA',W/2,H/2);ctx.font='18px system-ui';ctx.fillText(gameOver?`Eliminados: ${kills} · Pulsa R para reiniciar`:'Pulsa P para continuar',W/2,H/2+35);ctx.textAlign='left'}}function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;if(!paused&&!menu&&!gameOver)for(let i=0;i<speed;i++)step(dt);render();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();
</script></body></html>
