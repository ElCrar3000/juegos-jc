<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jugando con Pablo: Visual — Juegos JC</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f8ff;color:#17315a;font-family:system-ui;text-align:center}main{max-width:750px;margin:auto;padding:18px}h1{font-size:clamp(25px,5vw,40px)}button{cursor:pointer;border:0;border-radius:17px;padding:15px 20px;margin:7px;font-size:20px;background:#2879e4;color:white;box-shadow:0 4px 0 #17509e}button:active{transform:translateY(3px)}.card{background:white;border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #a6c7e655}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{font-size:clamp(38px,8vw,72px);background:#fff;color:#153b6d;border:3px solid #c3dbf5;box-shadow:none;min-height:115px}.option:disabled{opacity:.6}.big{font-size:clamp(40px,10vw,86px);letter-spacing:10px;min-height:120px}#feedback{font-size:25px;min-height:42px;font-weight:700}#game{display:none}#progress{font-size:18px}select{font-size:20px;padding:10px;border-radius:12px;border:2px solid #a8c5e9}#memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tile{font-size:45px;background:#dcecff;min-height:90px}.tile.open{background:white}</style></head><body><main><h1>🎨 Jugando con Pablo: Visual</h1><p>Juegos JC · Versión jugable</p><section id="home" class="card"><h2>¡Vamos a jugar!</h2><p>Elige un juego de observación.</p><button onclick="start('find')">🔎 Encuentra el dibujo</button><button onclick="start('odd')">🧩 ¿Cuál es diferente?</button><button onclick="start('memory')">🧠 Parejas de memoria</button><p>Dificultad: <select id="difficulty"><option value="easy">Fácil</option><option value="medium">Media</option><option value="hard">Difícil</option></select></p></section><section id="game" class="card"><div id="progress"></div><h2 id="question"></h2><div id="target" class="big"></div><div id="options" class="options"></div><div id="memory"></div><div id="feedback" aria-live="polite"></div><button id="next" style="display:none" onclick="nextRound()">Siguiente →</button><button onclick="home()">Volver al menú</button></section></main><script>const icons=['🐶','🐱','🐸','🦁','🐰','🐻','🐼','🦊','🐵','🐷','🐙','🐠','🦋','🐢','🍎','🍌','🍓','🍉','🚗','🚀','⚽','⭐','🌈','🌻'];let mode='',round=0,points=0,correct='',locked=false,deck=[],opened=[],matched=0;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function home(){$('home').style.display='block';$('game').style.display='none'}function start(m){mode=m;round=0;points=0;$('home').style.display='none';$('game').style.display='block';nextRound()}function nextRound(){round++;locked=false;$('next').style.display='none';$('feedback').textContent='';$('options').innerHTML='';$('memory').innerHTML='';$('target').textContent='';if(round>10){$('question').textContent='¡Juego terminado!';$('target').textContent='🏆';$('progress').textContent='';$('feedback').textContent=`Has conseguido ${points} puntos de 10`;return}$('progress').textContent=`Ronda ${round}/10 · Aciertos: ${points}`;let n=$('difficulty').value==='easy'?4:$('difficulty').value==='medium'?6:8;if(mode==='memory'){memory(n);return}let picks=shuffle(icons).slice(0,n);correct=picks[0];if(mode==='find'){$('question').textContent='¡Encuentra este dibujo!';$('target').textContent=correct}else{$('question').textContent='¿Cuál es diferente?';$('target').textContent='👀';picks=shuffle([...Array(n-1).fill(picks[1]),correct])}for(let item of shuffle(picks)){let b=document.createElement('button');b.className='option';b.textContent=item;b.onclick=()=>answer(item);$('options').append(b)}}function answer(item){if(locked)return;locked=true;let ok=item===correct;if(ok)points++;$('feedback').textContent=ok?'¡Muy bien! 🌟':'¡Buen intento! Era '+correct;$('next').style.display='inline-block'}function memory(n){$('question').textContent='Encuentra las parejas';$('target').textContent='';deck=shuffle(shuffle(icons).slice(0,n).flatMap((v,i)=>[{v,i},{v,i}]));opened=[];matched=0;deck.forEach((obj,i)=>{let b=document.createElement('button');b.className='tile';b.textContent='❔';b.onclick=()=>flip(i,b);$('memory').append(b)})}function flip(i,b){if(locked||b.classList.contains('open')||opened.some(x=>x.i===i))return;b.textContent=deck[i].v;b.classList.add('open');opened.push({i,b});if(opened.length===2){let [a,z]=opened;if(deck[a.i].i===deck[z.i].i){matched++;opened=[];if(matched===deck.length/2){points++;$('feedback').textContent='¡Todas las parejas! 🌟';$('next').style.display='inline-block'}}else{locked=true;setTimeout(()=>{a.b.textContent=z.b.textContent='❔';a.b.classList.remove('open');z.b.classList.remove('open');opened=[];locked=false},850)}}}</script></body></html>
