<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Guerra de 4 — Juegos JC</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:white;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:fixed;top:8px;left:10px;background:#101923bd;padding:10px;border-radius:10px;pointer-events:none}#menu{position:fixed;inset:0;background:#08121be9;display:grid;place-items:center;padding:15px}#panel{max-width:520px;text-align:center;background:#1c2b3c;padding:24px;border-radius:16px}button,select{padding:12px;border:0;border-radius:9px;margin:5px;background:#59a5e8;color:#08121b;font-weight:bold}#touch{display:none;position:fixed;bottom:25px;left:20px;right:20px;justify-content:space-between;pointer-events:none}.pad{width:105px;height:105px;border-radius:55px;background:#ffffff33;border:2px solid #ffffff77;display:grid;place-items:center;pointer-events:auto;touch-action:none}@media(pointer:coarse){#touch{display:flex}}</style></head><body><canvas id="c"></canvas><div id="hud"></div><div id="touch"><div class="pad" id="pad">MOVER</div><div class="pad" id="attack">ATACAR</div></div><div id="menu"><div id="panel"><h1>⚔️ Guerra de 4</h1><p>Alfa jugable · Juegos JC</p><p>Defiende tu núcleo, derrota rivales y roba el núcleo enemigo para sumar puntos.</p><label>Jugadores humanos: <select id="humans"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><p>Jugador 1: WASD + espacio · J2: flechas + Enter · J3: IJKL + U · J4: TFGH + R</p><p>En móvil: control táctil para el jugador 1.</p><button id="start">JUGAR</button></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),hud=document.getElementById('hud'),menu=document.getElementById('menu');let W,H,players=[],cores=[],resources=[],keys={},last=0,playing=false,humans=1,elapsed=0,joy={x:0,y:0},touchAttack=false;const colors=['#50c9ff','#ff6b6b','#f7d75e','#b98cff'],bases=[{x:-600,y:-400},{x:600,y:-400},{x:-600,y:400},{x:600,y:400}],controls=[['w','s','a','d',' '],['arrowup','arrowdown','arrowleft','arrowright','enter'],['i','k','j','l','u'],['t','g','f','h','r']];function resize(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=resize;resize();onkeydown=e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;const pad=document.getElementById('pad');let pid=null;function padmove(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.max(40,Math.hypot(x,y));joy={x:x/m,y:y/m}}pad.onpointerdown=e=>{pid=e.pointerId;pad.setPointerCapture(pid);padmove(e)};pad.onpointermove=e=>{if(e.pointerId===pid)padmove(e)};pad.onpointerup=()=>{pid=null;joy={x:0,y:0}};const attack=document.getElementById('attack');attack.onpointerdown=e=>{touchAttack=true;attack.setPointerCapture(e.pointerId)};attack.onpointerup=()=>touchAttack=false;function reset(){humans=+document.getElementById('humans').value;players=bases.map((b,i)=>({x:b.x+45,y:b.y+45,hp:100,respawn:0,team:i,score:0,attack:0,carry:null,wood:0,stone:0,food:0}));cores=bases.map((b,i)=>({x:b.x,y:b.y,home:i,carrier:null}));resources=[];for(let i=0;i<110;i++)resources.push({x:(Math.random()-.5)*1700,y:(Math.random()-.5)*1200,type:Math.random()<.55?'wood':Math.random()<.8?'stone':'food'});elapsed=0;playing=true;menu.style.display='none';last=performance.now();requestAnimationFrame(loop)}document.getElementById('start').onclick=reset;function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function hit(p){if(p.attack>0||p.respawn>0)return;p.attack=.55;let nearest=null;for(const q of players)if(q!==p&&q.respawn<=0&&distance(p,q)<85&&(!nearest||distance(p,q)<distance(p,nearest)))nearest=q;if(nearest){nearest.hp-=25;if(nearest.hp<=0){nearest.respawn=4;nearest.hp=100;p.score++;if(nearest.carry!==null){let core=cores[nearest.carry];core.carrier=null;core.x=nearest.x;core.y=nearest.y;nearest.carry=null}}}}function loop(t){if(!playing)return;let dt=Math.min(.04,(t-last)/1000);last=t;elapsed+=dt;for(let i=0;i<4;i++){let p=players[i],b=bases[i];p.attack=Math.max(0,p.attack-dt);if(p.respawn>0){p.respawn-=dt;if(p.respawn<=0){p.x=b.x+45;p.y=b.y+45}continue}let dx=0,dy=0;if(i<humans){let k=controls[i];dy=+(!!keys[k[1]])-+(!!keys[k[0]]);dx=+(!!keys[k[3]])-+(!!keys[k[2]]);if(i===0){dx+=joy.x;dy+=joy.y}if(keys[k[4]]||(i===0&&touchAttack))hit(p)}else{let target=cores.find(z=>z.home!==i&&z.carrier===null)||bases[(i+1)%4];let d=distance(p,target);dx=(target.x-p.x)/Math.max(1,d);dy=(target.y-p.y)/Math.max(1,d);for(const q of players)if(q!==p&&q.respawn<=0&&distance(p,q)<75)hit(p)}let m=Math.hypot(dx,dy);if(m){p.x+=dx/m*175*dt;p.y+=dy/m*175*dt}p.x=Math.max(-950,Math.min(950,p.x));p.y=Math.max(-700,Math.min(700,p.y));for(let j=resources.length-1;j>=0;j--)if(distance(p,resources[j])<23){p[resources[j].type]++;resources.splice(j,1)}for(let ci=0;ci<4;ci++){let core=cores[ci];if(ci!==i&&core.carrier===null&&distance(p,core)<32&&p.carry===null){core.carrier=i;p.carry=ci}}if(p.carry!==null){let core=cores[p.carry];core.x=p.x;core.y=p.y;if(distance(p,b)<85){p.score+=5;core.carrier=null;core.x=bases[core.home].x;core.y=bases[core.home].y;p.carry=null}}}draw();requestAnimationFrame(loop)}function draw(){g.fillStyle='#203d30';g.fillRect(0,0,W,H);let cam=players[0];g.save();g.translate(W/2-cam.x,H/2-cam.y);g.strokeStyle='#42634a';for(let x=-1000;x<=1000;x+=100){g.beginPath();g.moveTo(x,-800);g.lineTo(x,800);g.stroke()}for(let y=-800;y<=800;y+=100){g.beginPath();g.moveTo(-1100,y);g.lineTo(1100,y);g.stroke()}for(let i=0;i<4;i++){let b=bases[i];g.fillStyle='#29303b';g.fillRect(b.x-70,b.y-70,140,140);g.strokeStyle=colors[i];g.lineWidth=7;g.strokeRect(b.x-70,b.y-70,140,140);g.fillStyle=colors[i];g.font='bold 16px system-ui';g.fillText('CASTILLO '+(i+1),b.x-58,b.y-82)}for(let r of resources){g.fillStyle=r.type==='wood'?'#9b663c':r.type==='stone'?'#adb5bb':'#e6b95a';g.fillRect(r.x-6,r.y-6,12,12)}for(let core of cores){g.fillStyle=colors[core.home];g.beginPath();g.moveTo(core.x,core.y-17);g.lineTo(core.x+14,core.y);g.lineTo(core.x,core.y+17);g.lineTo(core.x-14,core.y);g.fill()}for(let p of players){if(p.respawn>0)continue;g.fillStyle=colors[p.team];g.beginPath();g.arc(p.x,p.y,18,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();g.fillStyle='#000';g.fillRect(p.x-23,p.y-34,46,7);g.fillStyle='#72ff85';g.fillRect(p.x-23,p.y-34,46*p.hp/100,7);if(p.attack>.35){g.strokeStyle='#fff8a3';g.lineWidth=5;g.beginPath();g.arc(p.x,p.y,35,0,Math.PI);g.stroke()}}g.restore();hud.innerHTML='<b>GUERRA DE 4 · Alfa</b><br>'+players.map((p,i)=>`<span style="color:${colors[i]}">J${i+1}: ${p.score} puntos ${p.respawn>0?'(reaparece)':''}</span>`).join('<br>')+`<br>Tu mochila: madera ${players[0].wood} · piedra ${players[0].stone} · comida ${players[0].food}<br>Tiempo: ${Math.floor(elapsed)} s`};</script></body></html>
