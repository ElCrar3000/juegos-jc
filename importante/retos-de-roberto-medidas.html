<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retos de Roberto: Medidas</title><style>body{margin:0;background:#10182b;color:white;font:16px system-ui;text-align:center}main{max-width:680px;margin:auto;padding:20px}button,select{background:#3279df;color:white;border:0;border-radius:12px;padding:12px;margin:5px;font-size:16px}canvas{background:#f4f7fb;border-radius:14px;max-width:100%;touch-action:none}#status{font-size:20px;margin:12px}small{color:#b7c7e8}</style></head><body><main><h1>Retos de Roberto: Medidas</h1><p>Juegos JC · Beta jugable</p><label>Modo <select id="mode"><option value="blind">Sin escala</option><option value="scale">Con escala</option></select></label><label>Dificultad <select id="difficulty"><option value="1">1 · Fácil</option><option value="2">2 · Normal</option><option value="3">3 · Difícil</option><option value="4">4 · Experto</option><option value="5">5 · Maestro</option></select></label><p id="target"></p><canvas id="c" width="620" height="270"></canvas><div id="status">Pulsa «Empezar» para jugar.</div><button id="start">Empezar</button><button id="confirm" disabled>Confirmar medida</button><p id="score"></p><small>Arrastra el extremo azul para elegir una longitud. Compatible con ratón y pantalla táctil.</small></main><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),target=document.querySelector('#target'),status=document.querySelector('#status'),score=document.querySelector('#score'),start=document.querySelector('#start'),confirm=document.querySelector('#confirm'),mode=document.querySelector('#mode'),difficulty=document.querySelector('#difficulty');let answer=0,guess=100,round=0,points=0,active=false,drag=false;function draw(){g.clearRect(0,0,620,270);g.fillStyle='#23334f';g.fillRect(40,128,540,4);if(mode.value==='scale'){g.fillStyle='#52657e';g.font='12px system-ui';for(let x=40;x<=580;x+=27){g.fillRect(x,118,1,20);g.fillText(Math.round((x-40)/5.4)+' cm',x-10,105)}}g.fillStyle='#377ee8';g.fillRect(40,125,guess*5.4,10);g.beginPath();g.arc(40+guess*5.4,130,13,0,Math.PI*2);g.fill();g.fillStyle='#23334f';g.font='17px system-ui';g.fillText('Inicio',22,165);g.fillText('Arrastra el círculo azul',190,215)}function newRound(){if(round>=5){active=false;confirm.disabled=true;status.textContent='¡Partida terminada! '+points+' puntos de 500';return}round++;let d=+difficulty.value,step=[0,10,5,2,1,.5][d];answer=Math.round((10+Math.random()*80)/step)*step;guess=50;active=true;confirm.disabled=false;target.textContent='Ronda '+round+'/5 · Intenta medir '+answer+' cm';status.textContent='Ajusta la longitud y confirma.';score.textContent='Puntos: '+points;draw()}start.onclick=()=>{round=0;points=0;newRound();start.textContent='Reiniciar partida'};confirm.onclick=()=>{if(!active)return;active=false;confirm.disabled=true;let error=Math.abs(answer-guess),earned=Math.max(0,Math.round(100-error*3));points+=earned;status.textContent='Tu medida: '+guess.toFixed(1)+' cm · Error: '+error.toFixed(1)+' cm · +'+earned+' puntos';score.textContent='Puntos: '+points;setTimeout(newRound,1800)};function adjust(e){if(!active||!drag)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*620/r.width;guess=Math.round(Math.max(0,Math.min(100,(x-40)/5.4))*10)/10;draw()}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);adjust(e)};c.onpointermove=adjust;c.onpointerup=()=>drag=false;c.onpointercancel=()=>drag=false;mode.onchange=draw;draw();</script></body></html>
