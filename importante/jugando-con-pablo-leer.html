<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jugando con Pablo: Leer — Juegos JC</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f9ff;color:#20324c;margin:0;text-align:center}main{max-width:720px;margin:auto;padding:18px}h1{font-size:clamp(24px,6vw,38px)}.card{background:white;border-radius:24px;padding:24px 12px;box-shadow:0 8px 24px #183b6120;margin:18px 0}.picture{font-size:clamp(65px,20vw,125px);min-height:150px}.word{font-size:clamp(42px,12vw,76px);font-weight:850;letter-spacing:3px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;border:0;border-radius:18px;padding:18px 8px;background:#dceafe;color:#15345a;font-size:clamp(22px,5vw,32px);font-weight:800;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}button.primary{background:#2676ef;color:white}button.correct{background:#6ee3a0}button.wrong{background:#ffaaa9}#feedback{font-size:25px;font-weight:bold;min-height:36px}#stats{font-size:17px}select{font:inherit;padding:9px;border-radius:10px}#next{display:none;width:100%;margin-top:12px}footer{font-size:13px;color:#60718b}</style></head><body><main><h1>🌟 Jugando con Pablo: Leer</h1><p>¡Mira el dibujo y encuentra su palabra!</p><label>Modo: <select id="mode"><option value="picture">Dibujo → palabra</option><option value="word">Palabra → dibujo</option></select></label><div class="card"><div id="stats">Aciertos: 0 · Ronda: 1/10</div><div id="prompt" class="picture">🐱</div><div id="choices" class="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary">SIGUIENTE ➜</button></div><button id="speak">🔊 Escuchar palabra</button><button id="restart">↻ Empezar de nuevo</button><footer>Juegos JC · Juego educativo sin anuncios ni conexión necesaria</footer></main><script>const words=[['SOL','☀️'],['LUNA','🌙'],['GATO','🐱'],['PERRO','🐶'],['CASA','🏠'],['PATO','🦆'],['OSO','🐻'],['PEZ','🐟'],['FLOR','🌸'],['ÁRBOL','🌳'],['COCHE','🚗'],['TREN','🚂'],['PAN','🍞'],['MANO','✋'],['BOCA','👄'],['OJO','👁️'],['LEÓN','🦁'],['VACA','🐮'],['RANA','🐸'],['MESA','🪑']];let round=0,score=0,current,options=[],locked=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function newRound(){locked=false;$('next').style.display='none';$('feedback').textContent='';current=words[Math.floor(Math.random()*words.length)];options=shuffle([current,...shuffle(words.filter(w=>w!==current)).slice(0,3)]);let picture=$('mode').value==='picture';$('prompt').className=picture?'picture':'word';$('prompt').textContent=picture?current[1]:current[0];$('stats').textContent=`Aciertos: ${score} · Ronda: ${round+1}/10`;$('choices').innerHTML='';options.forEach(w=>{let b=document.createElement('button');b.textContent=picture?w[0]:w[1];b.onclick=()=>answer(w,b);$('choices').appendChild(b)})}function answer(w,b){if(locked)return;locked=true;if(w===current){score++;b.classList.add('correct');$('feedback').textContent='¡MUY BIEN! ⭐'}else{b.classList.add('wrong');$('feedback').textContent='¡Sigue practicando! La respuesta es '+current[0];[...$('choices').children].forEach((el,i)=>{if(options[i]===current)el.classList.add('correct')})}speak();$('next').style.display='block';$('next').textContent=round===9?'VER RESULTADO':'SIGUIENTE ➜'}function speak(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(current[0].toLowerCase());u.lang='es-ES';u.rate=.8;window.speechSynthesis.speak(u)}$('speak').onclick=speak;$('next').onclick=()=>{round++;if(round>=10){$('prompt').textContent='🏆';$('prompt').className='picture';$('choices').innerHTML='';$('feedback').textContent=`¡Has conseguido ${score} de 10!`;$('next').style.display='none';$('stats').textContent='Partida terminada';return}newRound()};$('restart').onclick=()=>{round=0;score=0;newRound()};$('mode').onchange=()=>{round=0;score=0;newRound()};newRound();</script></body></html>
