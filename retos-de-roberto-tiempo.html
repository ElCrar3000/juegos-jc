<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retos de Roberto: Tiempo — Juegos JC</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263b72,#101729 70%);color:#f7faff;min-height:100vh;display:grid;place-items:center;padding:15px}main{width:min(540px,100%);background:#17223b;border:1px solid #526da1;border-radius:22px;padding:24px;box-shadow:0 18px 55px #0006}h1{margin:0;font-size:clamp(25px,5vw,35px)}.sub{color:#adc2e5}label{display:block;margin:15px 0 6px;font-weight:650}select,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #6c83b5;background:#263a60;color:white}select{width:100%}button{cursor:pointer;font-weight:750}button:disabled{opacity:.45;cursor:default}.primary{background:#4383f5;border:0}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.controls button{flex:1}.clock{font-size:clamp(43px,10vw,69px);font-variant-numeric:tabular-nums;text-align:center;padding:26px 0 12px;font-weight:850;letter-spacing:2px}.target{text-align:center;font-size:21px}.hint{min-height:42px;color:#bfd1ed;text-align:center}.result{text-align:center;font-size:20px;font-weight:750;min-height:30px}.hidden{display:none}.score{display:flex;justify-content:space-between;color:#b9d1ff;gap:12px;flex-wrap:wrap}.note{font-size:13px;color:#aebfda;margin-top:20px}kbd{background:#34496d;padding:2px 5px;border-radius:4px}</style></head><body><main><h1>⏱️ Retos de Roberto: Tiempo</h1><p class="sub">Juegos JC · Entrena tu percepción del tiempo</p><section id="setup"><label for="mode">Modo de juego</label><select id="mode"><option value="visible">Cronómetro visible: para en el momento exacto</option><option value="hidden">Cronómetro oculto: calcula el tiempo mentalmente</option><option value="pause">Pausa y confirma: detén, reanuda y confirma</option></select><label for="difficulty">Dificultad</label><select id="difficulty"><option value="0">1 · Muy fácil</option><option value="1">2 · Fácil</option><option value="2" selected>3 · Normal</option><option value="3">4 · Difícil</option><option value="4">5 · Experto</option></select><div class="controls"><button class="primary" id="begin">Empezar reto</button></div></section><section id="game" class="hidden"><div class="score"><span id="round"></span><span id="points"></span></div><p class="target" id="target"></p><div class="clock" id="clock">00:00.00</div><div class="hint" id="hint"></div><div class="controls"><button id="toggle" class="primary">▶ Iniciar</button><button id="confirm">✓ Confirmar</button></div><p class="result" id="result" aria-live="polite"></p><div class="controls"><button id="next" class="hidden primary">Siguiente reto →</button><button id="back">Cambiar modo</button></div></section><p class="note">En ordenador puedes usar <kbd>Espacio</kbd> para iniciar/pausar y <kbd>Enter</kbd> para confirmar. Funciona sin internet y en móvil.</p></main><script>
const $=id=>document.getElementById(id);let mode,diff,round,points,target,elapsed=0,startAt=0,running=false,finished=false,raf=0;const tolerances=[1.2,.7,.4,.2,.1],ranges=[[3,8],[5,13],[8,20],[12,35],[20,60]];function fmt(ms){let cs=Math.floor(ms/10),s=Math.floor(cs/100),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0')}function time(){return elapsed+(running?performance.now()-startAt:0)}function render(){if(!$('game').classList.contains('hidden')){$('clock').textContent=(mode==='hidden'&&running)?'??:??.??':fmt(time());if(running)raf=requestAnimationFrame(render)}}function pause(){if(running){elapsed=time();running=false;cancelAnimationFrame(raf)}}function newRound(){pause();elapsed=0;finished=false;round++;let [min,max]=ranges[diff];target=Math.round((min+Math.random()*(max-min))*100)/100;$('round').textContent='Ronda '+round+' / 5';$('points').textContent='Puntos: '+points;$('target').textContent='Objetivo: '+target.toFixed(2).replace('.',',')+' segundos';$('clock').textContent='00:00.00';$('result').textContent='';$('next').classList.add('hidden');$('toggle').disabled=false;$('confirm').disabled=false;$('toggle').textContent='▶ Iniciar';$('hint').textContent=mode==='pause'?'Puedes pausar y reanudar. Confirma cuando creas que has llegado.':mode==='hidden'?'El cronómetro se ocultará al empezar.':'Detén el cronómetro lo más cerca posible del objetivo.'}function begin(){mode=$('mode').value;diff=+$('difficulty').value;round=0;points=0;$('setup').classList.add('hidden');$('game').classList.remove('hidden');newRound()}function toggle(){if(finished)return;if(running){pause();$('toggle').textContent='▶ Reanudar';render()}else{startAt=performance.now();running=true;$('toggle').textContent='⏸ Pausar';render()}}function confirm(){if(finished)return;let value=time();pause();finished=true;let error=Math.abs(value-target*1000)/1000,limit=tolerances[diff],won=error<=limit,earned=won?Math.max(10,Math.round(100*(1-error/limit))):0;points+=earned;$('clock').textContent=fmt(value);$('points').textContent='Puntos: '+points;$('result').textContent=(won?'¡Acertaste! ':'Casi. ')+'Error: '+error.toFixed(2)+' s · +'+earned+' puntos';$('toggle').disabled=true;$('confirm').disabled=true;$('next').textContent=round===5?'Ver resultado final':'Siguiente reto →';$('next').classList.remove('hidden')}function next(){if(round===5){$('game').classList.add('hidden');$('setup').classList.remove('hidden');$('setup').innerHTML='<h2>¡Partida terminada!</h2><p>Has conseguido <b>'+points+' puntos</b> de un máximo de 500.</p><button class="primary" onclick="location.reload()">Volver a jugar</button>'}else newRound()}$('begin').onclick=begin;$('toggle').onclick=toggle;$('confirm').onclick=confirm;$('next').onclick=next;$('back').onclick=()=>{pause();$('game').classList.add('hidden');$('setup').classList.remove('hidden')};document.addEventListener('keydown',e=>{if($('game').classList.contains('hidden')||e.repeat)return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='Enter'){e.preventDefault();confirm()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){pause();$('toggle').textContent='▶ Reanudar'}});
</script></body></html>
